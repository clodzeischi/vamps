<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Preview</title>
    <style>
      :root { color-scheme: dark; --bg: #18181b; --panel: #222226; --line: #34343a; --text: #e6e3dc; --dim: #9a978f; --accent: #f0b848; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, sans-serif; display: flex; height: 100vh; overflow: hidden; }
      aside { width: 300px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
      aside header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
      aside header b { color: var(--accent); font-size: 15px; }
      label { display: inline-flex; gap: 5px; align-items: center; }
      #list { overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
      #list button { text-align: left; font: inherit; color: var(--text); background: #2c2c31; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; cursor: pointer; display: flex; flex-direction: column; }
      #list button:hover { border-color: var(--accent); }
      #list span { color: var(--dim); font-size: 12px; }
      #view { position: relative; flex: 1; }
      #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .tag { position: absolute; left: 0; top: 0; padding: 1px 6px; background: rgba(0,0,0,0.6); border-radius: 3px; font-size: 12px; white-space: nowrap; }
      .hint { padding: 8px 14px; color: var(--dim); border-top: 1px solid var(--line); font-size: 12px; }
    </style>
  </head>
  <body>
    <aside>
      <header><b>Materials</b><span><label><input type="checkbox" id="sheet" /> Close-ups</label> <label><input type="checkbox" id="night" /> Night</label></span></header>
      <div id="list"></div>
      <div class="hint">Click a name to fly to it. Drag to orbit, right-drag to pan, wheel to zoom. Models turn so you can see the pattern ride on them.</div>
    </aside>
    <div id="view"><div id="labels"></div></div>
    <script type="module" src="/src/gallery/materials.ts"></script>
  </body>
</html>
