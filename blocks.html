<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Editor</title>
    <link rel="icon" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #141416;
        --panel: #1e1e21;
        --panel2: #26262a;
        --line: #333338;
        --text: #e6e3dc;
        --dim: #8e8b84;
        --accent: #f0b848;
        --bad: #ff6b5b;
        --warn: #f0b848;
        --high: #e0675a;
        --low: #e8c35a;
        --none: #8a8f98;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
      .dim { color: var(--dim); }
      .dirty { color: var(--accent); }
      select, input, textarea, button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
      textarea { width: 100%; resize: vertical; min-height: 54px; }
      input[type="search"] { width: 100%; padding: 6px 9px; }
      button { cursor: pointer; }
      button:hover { border-color: #55555c; }
      button.on { border-color: var(--accent); color: var(--accent); background: #2f2a20; }
      button.danger:hover { border-color: var(--bad); color: var(--bad); }
      .seg { display: inline-flex; flex-wrap: wrap; }
      .seg button { border-radius: 0; margin-left: -1px; }
      .seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
      .seg button:last-child { border-radius: 0 4px 4px 0; }
      .spacer { flex: 1; }

      /* The top bar: files, undo, light and weather. */
      header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
      header b { font-size: 14px; color: var(--accent); letter-spacing: 0.02em; }

      .body { flex: 1; display: flex; min-height: 0; }
      aside { flex: none; overflow: auto; background: var(--panel); padding: 12px 12px 24px; display: flex; flex-direction: column; gap: 12px; }
      aside.left { width: 320px; border-right: 1px solid var(--line); }
      aside.right { width: 260px; border-left: 1px solid var(--line); }
      aside h2 { margin: 0; font-size: 15px; font-weight: 600; }
      aside h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
      .help { color: var(--dim); font-size: 12px; }
      .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
      .tools button { text-align: left; padding: 5px 8px; }
      .tools kbd { float: right; color: var(--dim); font: 11px ui-monospace, monospace; }
      .options { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
      .row { display: flex; flex-wrap: wrap; gap: 4px; }
      .field { display: flex; flex-direction: column; gap: 3px; }
      .field > span { color: var(--dim); font-size: 12px; }
      .checks { display: flex; flex-wrap: wrap; gap: 2px 10px; }
      .checks label { display: inline-flex; gap: 4px; align-items: center; }
      .swatches { display: flex; flex-wrap: wrap; gap: 3px; max-height: 260px; overflow: auto; }
      .swatches button { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; font-size: 12px; }
      i { font-style: normal; }
      .swatches i, .prow i { width: 11px; height: 11px; border-radius: 2px; background: var(--c); border: 1px solid rgba(0,0,0,0.4); flex: none; }
      .group { width: 100%; color: var(--dim); font-size: 11px; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.06em; }

      /* The prop browser. */
      .browser { display: flex; flex-direction: column; gap: 6px; }
      .chips button { font-size: 12px; padding: 2px 7px; }
      .plist { display: flex; flex-direction: column; gap: 1px; max-height: calc(100vh - 470px); min-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; padding: 4px; background: #19191b; }
      .plist .group { margin: 6px 4px 2px; }
      .plist .none { color: var(--dim); padding: 8px; }
      .prow { display: flex; align-items: center; gap: 7px; text-align: left; border: 1px solid transparent; background: none; padding: 3px 6px; }
      .prow:hover { background: var(--panel2); border-color: transparent; }
      .prow.on { background: #2f2a20; border-color: var(--accent); }
      .prow span { flex: 1; }
      .cov { font: 600 10px ui-monospace, monospace; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; border: 1px solid; }
      .cov.high { color: var(--high); border-color: var(--high); }
      .cov.low { color: var(--low); border-color: var(--low); }
      .cov.none { color: var(--none); border-color: #4a4d55; }

      /* The view and what's laid over it. */
      .viewport { flex: 1; position: relative; min-width: 0; background: #0c0e14; }
      .view { position: absolute; inset: 0; overflow: hidden; }
      .view canvas { display: block; width: 100%; height: 100%; }
      .info { position: absolute; top: 8px; left: 10px; z-index: 3; font: 12px ui-monospace, monospace; color: #cfcab8; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 3px; pointer-events: none; white-space: pre; }
      .levels { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; flex-direction: column; gap: 2px; }
      .levels button { background: rgba(20,20,24,0.8); font-size: 12px; padding: 3px 10px; text-align: right; }
      /* Under the view, as in a battle: what the mouse does, what's wrong, why not. */
      .hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 3; max-width: 80%; text-align: center; padding: 4px 12px; background: rgba(0,0,0,0.6); color: #cfcab8; font-size: 12px; pointer-events: none; }
      .hint.warn { color: var(--warn); }
      .hint.bad { color: var(--bad); font-weight: 600; }
      .say { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); z-index: 3; padding: 5px 14px; background: rgba(0,0,0,0.75); border: 1px solid var(--line); color: var(--text); pointer-events: none; }

      .issues { margin: 0; padding-left: 16px; color: var(--bad); }
      .issues li { cursor: pointer; margin-bottom: 4px; }
      .issues li:hover { color: var(--accent); }
      .ok { color: #7ad08a; }

      /* The pages, along the bottom (the order a level is made in). */
      .pages { display: flex; justify-content: center; gap: 2px; padding: 4px; background: var(--panel); border-top: 1px solid var(--line); }
      .pages button { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 96px; padding: 4px 12px; border: 1px solid transparent; background: none; color: var(--dim); }
      .pages button i { font-size: 18px; line-height: 1.1; }
      .pages button span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
      .pages button:hover { color: var(--text); }
      .pages button.on { color: var(--accent); border-color: transparent; background: #2a261d; }
    </style>
  </head>
  <body>
    <div id="app" style="display: contents"></div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
